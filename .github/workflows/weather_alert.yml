name: Weather Alert Bot

on:
  # 定时任务：每天北京时间 9:00 (UTC 1:00) 和 17:00 (UTC 9:00)
  schedule:
    - cron: '0 1 * * *'   # 每天 UTC 1:00 (北京时间 9:00)
    - cron: '0 9 * * *'   # 每天 UTC 9:00 (北京时间 17:00)

  # 允许手动触发
  workflow_dispatch:

  # 代码推送时触发（可选）
  push:
    branches:
      - main

# 设置权限以便部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制：同一时间只运行一个部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 创建 .env 配置文件
        run: |
          echo "QWEATHER_API_KEY=${{ secrets.QWEATHER_API_KEY }}" >> .env
          echo "CITY=${{ secrets.CITY }}" >> .env
          echo "ALERT_TYPES=${{ secrets.ALERT_TYPES }}" >> .env
          echo "FEISHU_WEBHOOK=${{ secrets.FEISHU_WEBHOOK }}" >> .env
          echo "FEISHU_SECRET=${{ secrets.FEISHU_SECRET }}" >> .env
          echo "REPORT_URL=${{ secrets.REPORT_URL }}" >> .env

      - name: 运行气象预警脚本
        run: |
          python weather_alert.py
          echo "脚本运行完成"

      - name: 上传 HTML 报告为 artifact
        uses: actions/upload-artifact@v4
        with:
          name: weather-report
          path: index.html

  # 部署到 GitHub Pages
  deploy:
    needs: check-weather
    runs-on: ubuntu-latest

    # 设置 GitHub Pages 部署环境
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 下载 HTML 报告
        uses: actions/download-artifact@v4
        with:
          name: weather-report

      - name: 设置 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 上传到 GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 输出部署 URL
        run: |
          echo "报告已部署到: ${{ steps.deployment.outputs.page_url }}"
