name: Tropical Disturbance Monitor

on:
  schedule:
    - cron: '0 0 * * *'   # 北京时间 8:00
    - cron: '0 12 * * *'  # 北京时间 20:00

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装系统依赖
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 诊断 tropycal 导入
        run: |
          python -c "
          import sys
          print('Python:', sys.version)
          try:
              import tropycal
              print('tropycal version:', tropycal.__version__)
          except Exception as e:
              print('tropycal import ERROR:', e)
          try:
              import tropycal.realtime
              print('tropycal.realtime: OK')
          except Exception as e:
              print('tropycal.realtime import ERROR:', e)
          "

      - name: 创建 .env 配置文件
        run: |
          echo "FEISHU_WEBHOOK=${{ secrets.FEISHU_WEBHOOK }}" >> .env
          echo "FEISHU_SECRET=${{ secrets.FEISHU_SECRET }}" >> .env
          echo "REPORT_URL=${{ secrets.REPORT_URL }}" >> .env

      - name: 运行热带扰动监控脚本
        run: |
          python weather_alert.py
          echo "脚本运行完成"

      - name: 上传 HTML 报告为 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typhoon-report
          path: index.html

  deploy:
    needs: monitor
    runs-on: ubuntu-latest
    if: always()

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 下载 HTML 报告
        uses: actions/download-artifact@v4
        with:
          name: typhoon-report

      - name: 设置 GitHub Pages
        uses: actions/configure-pages@v4

      - name: 上传到 GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 输出部署 URL
        run: |
          echo "报告已部署到: ${{ steps.deployment.outputs.page_url }}"
